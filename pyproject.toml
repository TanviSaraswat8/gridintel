[project]
name = "gridintel"
version = "2.1.0"
description = "AI-powered grid intelligence for predictive substation monitoring (research prototype)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.coverage.run]
omit = ["ml/pipeline/benchmarks.py"]   # needs the external ETT download; exercised by scripts/run_benchmarks.py
