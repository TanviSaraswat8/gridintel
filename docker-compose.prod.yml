# Production-style stack (single host). Secrets come from the environment / .env.production — never committed.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
services:
  api:
    image: ${API_IMAGE:-ghcr.io/OWNER/gridintel-api:latest}
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS (e.g. https://gridintel.vercel.app)}
      DEMO_USERS_ENABLED: ${DEMO_USERS_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATA_ROOT: /data
      MODEL_PATH: /models
      REPORTS_DIR: /models/reports
      LOG_LEVEL: INFO
    volumes:
      - gridintel-data:/data       # copy the private HVPNL workbooks into /data/raw on this volume
      - gridintel-models:/models
    depends_on: [redis]
    read_only: false
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
volumes:
  gridintel-data:
  gridintel-models:
