name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check backend ml tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Python byte-compile
        run: python -m compileall -q backend ml scripts
      - name: Web modules parse check
        run: for f in frontend/assets/js/*.js frontend/assets/js/app/*.js; do node --check "$f"; done
      - name: Web production build (config.js from API_URL) + no localhost in shipped web/mobile code
        run: |
          cd frontend && API_URL=https://example.invalid node build-config.mjs && grep -q example.invalid config.js && git checkout config.js && cd ..
          ! grep -rnE "https?://(localhost|127\.0\.0\.1)" frontend/*.html frontend/assets/js mobile/src mobile/App.js
      - name: Translation tables are generated from i18n/translations.py
        run: python scripts/build_i18n.py --check

  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: gridintel, POSTGRES_PASSWORD: gridintel, POSTGRES_DB: gridintel }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridintel" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Unit + pipeline + API tests (synthetic fixture workbook; private HVPNL data is not in the repo)
        run: pytest -q --cov=backend/app --cov=ml/pipeline --cov-report=term-missing --cov-report=xml
      - name: Migrations against PostgreSQL
        working-directory: backend
        env: { DATABASE_URL: "postgresql://gridintel:gridintel@localhost:5432/gridintel" }
        run: python -m alembic upgrade head
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  build-mobile:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist
        env: { CI: "1", EXPO_OFFLINE: "1" }

  docker:
    needs: [test, build-mobile]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gridintel-api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build production image
        uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: "gridintel:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Smoke-test the production image (public demo mode, no private data)
        run: |
          ! docker run --rm --entrypoint sh gridintel:ci -c 'find / -xdev \( -iname "*.xlsx" -o -iname "*.xls" \) 2>/dev/null' | grep .
          docker run -d --name gi -p 8000:8000 -e APP_ENV=production -e JWT_SECRET=ci-only-secret-0123456789abcdef0123 \
            -e TRAIN_ON_START=false -e DEMO_USERS_ENABLED=false -e DATA_MODE=public gridintel:ci
          for i in $(seq 1 60); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS localhost:8000/health | grep -q '"PUBLIC DEMO MODE"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)" = 503      # awaiting the artifact bundle
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/substations)" = 401
          for p in / /app /mobile/ /assets/js/i18n.js; do curl -fsS -o /dev/null "localhost:8000$p"; done
          curl -fsSI localhost:8000/app | grep -qi content-security-policy
          docker logs gi | tail -20; docker rm -f gi
      - uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
