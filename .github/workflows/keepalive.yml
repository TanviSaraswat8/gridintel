name: Keep demo awake

# Render's free plan puts the service to sleep after ~15 minutes without traffic, and the next visitor
# waits about a minute while it starts. Pinging /health every 10 minutes keeps it warm.
# One always-on free instance uses ~744 h/month, inside Render's 750 free instance hours.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health (waits for a cold start if needed)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 https://gridintel-6gce.onrender.com/health; then echo; exit 0; fi
            echo "not up yet (attempt $i)"; sleep 20
          done
          exit 1
      - name: Ready check
        run: curl -fsS --max-time 30 https://gridintel-6gce.onrender.com/ready; echo
